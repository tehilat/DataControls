<a class="skip-link" href="#main">דילוג לתוכן הראשי</a>

<mat-toolbar class="app-toolbar">
  <a routerLink="/controls" class="brand" aria-label="רדאר — בקרות איכות נתונים, דף הבית">
    <mat-icon aria-hidden="true" class="brand-icon">radar</mat-icon>
    <span class="brand-name">רדאר</span>
    <span class="brand-text">בקרות איכות נתונים</span>
  </a>
  <nav class="nav" aria-label="ניווט ראשי">
    <a mat-button routerLink="/controls" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
      <mat-icon>list_alt</mat-icon><span class="nav-text">בקרות</span>
    </a>
    <a mat-button routerLink="/runs" routerLinkActive="active" ariaCurrentWhenActive="page">
      <mat-icon>history</mat-icon><span class="nav-text">היסטוריית הרצות</span>
    </a>
    <a mat-button routerLink="/controls/ai" routerLinkActive="active" ariaCurrentWhenActive="page">
      <mat-icon>auto_awesome</mat-icon><span class="nav-text">צור בעזרת AI</span>
    </a>
  </nav>
</mat-toolbar>

<main id="main" class="page" tabindex="-1">
  <router-outlet />
</main>
